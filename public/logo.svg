<svg width="750" height="265" viewBox="0 0 750 265" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Sphere with hexagonal pattern -->
  <defs>
    <linearGradient id="sphereGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <pattern id="hexPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="8" fill="none" stroke="url(#sphereGradient)" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Main sphere -->
  <circle cx="132" cy="132" r="100" fill="url(#sphereGradient)" opacity="0.1"/>
  <circle cx="132" cy="132" r="100" fill="url(#hexPattern)"/>
  <circle cx="132" cy="132" r="100" fill="none" stroke="url(#sphereGradient)" stroke-width="2"/>

  <!-- Hexagonal dots on sphere -->
  <g opacity="0.8">
    <circle cx="100" cy="100" r="4" fill="#06b6d4"/>
    <circle cx="120" cy="95" r="4" fill="#06b6d4"/>
    <circle cx="140" cy="100" r="4" fill="#3b82f6"/>
    <circle cx="110" cy="115" r="4" fill="#3b82f6"/>
    <circle cx="130" cy="115" r="4" fill="#3b82f6"/>
    <circle cx="150" cy="115" r="4" fill="#3b82f6"/>
    <circle cx="95" cy="130" r="4" fill="#06b6d4"/>
    <circle cx="115" cy="135" r="4" fill="#3b82f6"/>
    <circle cx="135" cy="135" r="4" fill="#8b5cf6"/>
    <circle cx="155" cy="130" r="4" fill="#8b5cf6"/>
    <circle cx="100" cy="150" r="4" fill="#06b6d4"/>
    <circle cx="120" cy="155" r="4" fill="#3b82f6"/>
    <circle cx="140" cy="150" r="4" fill="#8b5cf6"/>
    <circle cx="110" cy="170" r="4" fill="#3b82f6"/>
    <circle cx="130" cy="170" r="4" fill="#8b5cf6"/>
  </g>

  <!-- Text "Sobranie" -->
  <text x="270" y="160" font-family="Arial, sans-serif" font-size="80" font-weight="600">
    <tspan fill="#06b6d4">Sob</tspan><tspan fill="url(#sphereGradient)">ranie</tspan>
  </text>
</svg>